<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이미지 라벨링</title>
<style>
:root{--bg:#14090f;--card:#22121b;--fg:#f5eef0;--mut:#a8959e;--acc:#d9c08f;--line:#3a2530}
@media(prefers-color-scheme:light){:root{--bg:#f7f2f3;--card:#fff;--fg:#26151c;--mut:#7a6670;--acc:#8a6d3a;--line:#e2d6da}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,'Noto Sans KR',sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--mut);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}.bar>i{display:block;height:100%;background:var(--acc);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
img{display:block;max-width:100%;max-height:440px;margin:0 auto 14px;border-radius:12px}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 6px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#1a0f14;border-color:var(--acc);font-weight:700}
.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}
.cnt{margin-top:14px;color:var(--mut);font-size:13px;text-align:center}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
<main>
<div class="top"><span id="pos"></span><span id="name"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="card">
  <img id="img" alt="">
  <p class="hint">이 이미지에 어울리는 <b>노래의 감정</b>을 고르세요. 키보드 1~8 = 감정, 0 = 애매함(건너뛰기), ← → 이동</p>
  <div class="grid" id="grid"></div>
  <div class="nav"><button id="prev">← 이전</button><button id="skip">0 · 건너뛰기</button><button id="next">다음 →</button></div>
</div>
<p class="cnt" id="cnt"></p>
<p class="cnt"><button id="export" style="padding:10px 18px">라벨 CSV 내보내기</button><br><span id="msg"></span></p>
</main>
<script>
const ITEMS=[{"file": "c009.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c009.jpg"}, {"file": "c013.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c013.jpg"}, {"file": "c015.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c015.jpg"}, {"file": "c018.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c018.jpg"}, {"file": "c021.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c021.jpg"}, {"file": "c022.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c022.jpg"}, {"file": "c024.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c024.jpg"}, {"file": "c026.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c026.jpg"}, {"file": "c027.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c027.jpg"}, {"file": "c029.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c029.jpg"}, {"file": "c031.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c031.jpg"}, {"file": "c032.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c032.jpg"}, {"file": "c039.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c039.jpg"}, {"file": "c043.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c043.jpg"}, {"file": "c045.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c045.jpg"}, {"file": "c046.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c046.jpg"}, {"file": "c048.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c048.jpg"}, {"file": "c051.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c051.jpg"}, {"file": "c063.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c063.jpg"}, {"file": "c065.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c065.jpg"}, {"file": "c066.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c066.jpg"}, {"file": "c075.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c075.jpg"}, {"file": "c076.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c076.jpg"}, {"file": "c083.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c083.jpg"}, {"file": "c088.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c088.jpg"}, {"file": "c097.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c097.jpg"}, {"file": "c099.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/c099.jpg"}, {"file": "p005.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/p005.jpg"}, {"file": "p008.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/p008.jpg"}, {"file": "p022.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/p022.jpg"}, {"file": "p029.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/p029.jpg"}, {"file": "p032.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/p032.jpg"}, {"file": "p035.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/p035.jpg"}, {"file": "p036.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/p036.jpg"}, {"file": "p046.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/p046.jpg"}, {"file": "p049.jpg", "img": "file:///C:/Users/Atomic/Desktop/CODE/Spring/Sync/Sync/ClipServer/data/eval_review_rest_images/p049.jpg"}], EMO=[["happy", "행복"], ["sad", "슬픔"], ["calm", "평온"], ["energetic", "활기"], ["romantic", "로맨틱"], ["melancholy", "우울/쓸쓸"], ["angry", "분노"], ["dreamy", "몽환"]], KEY='eval_final_rest_v1:'+ITEMS.length+':'+(ITEMS[0]?ITEMS[0].file:'');
let i=0, L={};
try{L=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}};
function go(d){const n=i+d; if(n>=0&&n<ITEMS.length){i=n;show()}}
function pick(k){const f=ITEMS[i].file; if(k===''){delete L[f]} else {L[f]=k} save(); show(); setTimeout(()=>go(1),160)}
function show(){
  const it=ITEMS[i], cur=L[it.file];
  $('img').src=it.img; $('name').textContent=it.file;
  const n=Object.keys(L).length;
  $('pos').textContent=(i+1)+' / '+ITEMS.length+'  ·  라벨 '+n; $('bar').style.width=(n/ITEMS.length*100)+'%';
  $('grid').innerHTML='';
  EMO.forEach(([k,ko],j)=>{const b=document.createElement('button');b.textContent=(j+1)+' · '+ko+' ('+k+')';
    if(cur===k)b.classList.add('on'); b.onclick=()=>pick(k); $('grid').appendChild(b)});
  const c={}; Object.values(L).forEach(v=>c[v]=(c[v]||0)+1);
  $('cnt').textContent=EMO.map(([k,ko])=>ko+' '+(c[k]||0)).join(' · ');
}
$('prev').onclick=()=>go(-1); $('next').onclick=()=>go(1); $('skip').onclick=()=>pick('');
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(-1); else if(e.key==='ArrowRight')go(1);
  else if(e.key==='0')pick(''); else if(e.key>='1'&&e.key<='8')pick(EMO[+e.key-1][0]);});
$('export').onclick=()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=['file,emotion'].concat(ITEMS.filter(it=>L[it.file]).map(it=>q(it.file)+','+q(L[it.file])));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eval_final_labels_rest.csv';a.click();
  $('msg').textContent=(lines.length-1)+'장 라벨됨 — 받은 eval_final_labels_rest.csv 를 ClipServer/data/ 에 두세요';
};
show();
</script></html>
